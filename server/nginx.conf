# 旅途管家后端 - Nginx 反向代理 + HTTPS 示例
# 放置位置：/etc/nginx/conf.d/lvguanjia.conf
# 前置：已申请并部署 SSL 证书（Let's Encrypt 或云厂商），域名已 ICP 备案

server {
    listen 80;
    server_name api.your-domain.com;
    # 强制跳转到 HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name api.your-domain.com;

    ssl_certificate     /etc/nginx/ssl/api.your-domain.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/api.your-domain.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # 上传文件大小（如后续支持图片）
    client_max_body_size 10m;

    location / {
        proxy_pass         http://127.0.0.1:8000;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # 接口文档生产可关闭或加 IP 白名单
    location /docs {
        allow 127.0.0.1;
        deny all;
        proxy_pass http://127.0.0.1:8000;
    }
}
